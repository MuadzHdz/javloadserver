<!DOCTYPE html>
<html lang="en" th:data-theme="${theme}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxLoad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <div class="theme-switcher theme-carousel" aria-label="Theme switcher">
        <button id="theme-prev" class="theme-btn" aria-label="Previous theme">&lt;</button>
        <div class="theme-display" id="theme-display" role="status" aria-live="polite" tabindex="0"></div>
        <button id="theme-next" class="theme-btn" aria-label="Next theme">&gt;</button>
    </div>

    <div class="container">
        <header>
            <h1>FluxLoad</h1>
        </header>

        <div id="color-palette-display" class="color-palette-display"></div>

        <main>
            <div class="file-list-section">
                <h2>/<span th:text="${current_path}"></span></h2>
                <ul>
                    <li th:if="${parent_dir != null}" class="parent-dir">
                        <a th:href="@{/browse(path=${parent_dir})}">
                            <span class="material-icons">folder_open</span>&nbsp;&nbsp;&nbsp;<span>..</span>
                        </a>
                    </li>
                    <li th:each="dir : ${dirs}">
                        <a th:href="@{/browse(path=${#strings.isEmpty(current_path) ? dir : current_path + '/' + dir})}">
                            <span class="material-icons">folder</span>&nbsp;&nbsp;&nbsp;<span th:text="${dir}"></span>
                        </a>
                    </li>
                    <li th:each="file : ${files}">
                        <a th:href="@{/download(filename=${#strings.isEmpty(current_path) ? file : current_path + '/' + file})}">
                            <span class="material-icons">description</span>&nbsp;&nbsp;<span th:text="${file}"></span>
                        </a>
                    </li>
                </ul>
                <p th:if="${#lists.isEmpty(files) and #lists.isEmpty(dirs) and parent_dir == null}">Directory is empty.</p>
            </div>

            <div class="upload-section">
                <h2>Upload</h2>

                <form th:action="@{/upload(path=${#strings.isEmpty(current_path) ? '' : current_path})}" method="post" enctype="multipart/form-data" id="upload-form">
                    <label for="file-input" class="file-input-label" id="drop-area">
                        <span class="material-icons">cloud_upload</span> 
                        <span id="upload-text">Drag & Drop files here or Click to select</span>
                        <span class="upload-hint">Supports files up to 1000MB (1GB). Multiple files allowed.</span>
                    </label>

                    <input type="file" name="file" id="file-input" required multiple>
                    <button type="submit" class="btn" id="upload-btn">
                        <span class="btn-icon material-icons">upload</span>
                        <span class="btn-text">Upload Files</span>
                    </button>
                </form>

                <!-- Progress Bar -->
                <div id="upload-progress-container" style="display: none;">
                    <div class="progress-info">
                        <span id="progress-filename">Uploading...</span>
                        <span id="progress-percentage">0%</span>
                        <span id="progress-size">0 MB / 0 MB</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <div id="upload-status" class="upload-status"></div>
                    <button id="cancel-upload" class="btn cancel-btn" style="display: none;">Cancel Upload</button>
                </div>

                <div th:if="${error}" class="flashes">
                    <ul class="flashes">
                        <li class="error" th:text="${error}"></li>
                    </ul>
                </div>

                <div th:if="${success}" class="flashes">
                    <ul class="flashes">
                        <li class="success" th:text="${success}"></li>
                    </ul>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Powered by <a href="https://github.com/MuadzHdz/FluxLoad" target="_blank">MuadzHdz</a></p>
        </footer>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
