<!DOCTYPE html>
<html lang="en" th:data-theme="${theme}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview — <span th:text="${filename}"></span> — FluxLoad</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .preview-container { width: 100%; max-width: 1000px; padding: 1rem; }
        .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--overlay); }
        .preview-info { display: flex; flex-direction: column; gap: 0.5rem; }
        .preview-filename { font-family: var(--font-mono); font-size: 1.2rem; color: var(--primary); word-break: break-all; }
        .preview-meta { font-size: 0.9rem; color: var(--subtle); }
        .preview-actions { display: flex; gap: 0.5rem; }
        .preview-actions .btn { padding: 0.5rem 1rem; font-size: 0.9rem; min-width: auto; }
        .preview-content { background: var(--surface); border: 1px solid var(--overlay); border-radius: var(--border-radius); padding: 1.5rem; overflow: auto; max-height: 70vh; }
        .preview-image { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: var(--border-radius); }
        .preview-text { font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; color: var(--fg); background: transparent; border: none; outline: none; resize: none; width: 100%; min-height: 400px; }
        .no-preview { text-align: center; color: var(--subtle); padding: 2rem; }
        .no-preview .material-icons { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="container preview-container">
        <header class="preview-header">
            <div class="preview-info">
                <h1 class="preview-filename" th:text="${filename}"></h1>
                <div class="preview-meta">
                    <span>Size: <span th:text="${#numbers.formatDecimal(fileSize / 1024.0, 0, 2)}"></span> KB</span>
                    <span th:if="${mimeType}">Type: <span th:text="${mimeType}"></span></span>
                </div>
            </div>
            <div class="preview-actions">
                <a th:href="@{/download(filename=${filename})}" class="btn">
                    <span class="material-icons">download</span> Download
                </a>
                <a href="/browse" class="btn">
                    <span class="material-icons">arrow_back</span> Back
                </a>
            </div>
        </header>

        <main class="preview-content">
            <div th:if="${isImage}">
                <img th:src="@{/download(filename=${filename})}" th:alt="${filename}" class="preview-image">
            </div>
            <div th:if="${isText and content != null}">
                <textarea class="preview-text" readonly th:text="${content}"></textarea>
            </div>
            <div th:if="${!isImage and !(isText and content != null)}" class="no-preview">
                <span class="material-icons">preview_off</span>
                <h3>Preview Not Available</h3>
                <p>This file type cannot be previewed. Please download the file to view its contents.</p>
            </div>
        </main>
    </div>

    <div class="theme-switcher theme-carousel" aria-label="Theme switcher">
        <button id="theme-prev" class="theme-btn" aria-label="Previous theme">&lt;</button>
        <div class="theme-display" id="theme-display" role="status" aria-live="polite" tabindex="0"></div>
        <button id="theme-next" class="theme-btn" aria-label="Next theme">&gt;</button>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>
</html>
