# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.servlet.context-path=/
server.servlet.multipart.max-file-size=100MB
server.servlet.multipart.max-request-size=100MB

# MVC Configuration
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# CORS Configuration
server.cors.allowed-origins=*
server.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
server.cors.allowed-headers=*

# Logging Configuration
logging.level.com.javloadserver=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Performance Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Production Configuration
server.error.whitelabel.enabled=false
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/octet-stream

# Security Headers
security.headers.frame-options=DENY
security.headers.content-type-options=nosniff
security.headers.xss-protection=1; mode=block