# ==============================================
# UPLOADSERVER - Docker Compose
# =============================================

version: '3.8'

services:
  uploadserver:
    build: .
    container_name: uploadserver
    restart: unless-stopped
    ports:
      - \"5000:5000\"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=sqlite:///data/uploadserver.db
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-104857600}  # 100MB
      - RATE_LIMIT_STORAGE_URL=memory://
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - uploadserver-network
    healthcheck:
      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:5000/health\"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: uploadserver-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - uploadserver-network

  nginx:
    image: nginx:alpine
    container_name: uploadserver-nginx
    restart: unless-stopped
    ports:
      - \"80:80\"
      - \"443:443\"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - uploadserver
    networks:
      - uploadserver-network

volumes:
  redis_data:

networks:
  uploadserver-network:
    driver: bridge
